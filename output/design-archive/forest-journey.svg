<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" overflow="hidden" fill="none" role="img" aria-labelledby="forest-title forest-desc">
  <title id="forest-title">약제사가 걷는 다정한 들녘</title>
  <desc id="forest-desc">부드러운 녹색 언덕과 약초 숲, 햇살이 비치는 작은 마을을 살구색 길로 잇는 독창적인 민속 판화 풍경. 배낭을 멘 작은 동물 약제사가 강 위의 다리로 향합니다.</desc>
